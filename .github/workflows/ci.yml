name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build (linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake libboost-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build Exact + PRINTEMPS + driver
        run: CPU_ARCH=broadwell ./build.sh

      - name: Package
        run: |
          STAGE="printemps_pb26"
          mkdir -p "$STAGE/bin" "$STAGE/Exact" "$STAGE/printemps"
          cp bin/Exact bin/pb_competition_2025_solver bin/pb-hybrid "$STAGE/bin/"
          git archive --format=tar HEAD | tar -x -C "$STAGE"
          git -C Exact archive --format=tar HEAD | tar -x -C "$STAGE/Exact"
          git -C printemps archive --format=tar HEAD | tar -x -C "$STAGE/printemps"
          {
            echo "Source repository: ${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}"
            echo "Driver commit:    ${GITHUB_SHA:-}"
            echo "Exact commit:     $(git -C Exact rev-parse HEAD)"
            echo "PRINTEMPS commit: $(git -C printemps rev-parse HEAD)"
          } > "$STAGE/BUILD_INFO.txt"
          tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: printemps_pb26
          path: printemps_pb26.tar.gz
          if-no-files-found: error
