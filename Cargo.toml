[package]
name = "pb-hybrid"
version = "0.1.0"
edition = "2021"
description = "Hybrid Exact/SCIP + PRINTEMPS driver for Pseudo Boolean Competitions"
license = "MIT"

[lib]
name = "pb_hybrid"
path = "src/lib.rs"

[[bin]]
name = "exact-printemps"
path = "src/bin/exact_printemps.rs"

[[bin]]
name = "scip-printemps"
path = "src/bin/scip_printemps.rs"

[dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"
russcip = { version = "0.5", default-features = false }

[features]
default = []
# Build SCIP from a prebuilt bundle (downloaded by russcip's `bundled` feature).
# Requires network access at build time. Without this feature, SCIP must be
# available via SCIPOPTDIR or system include paths.
bundled-scip = ["russcip/bundled"]
# Compile SCIP from source. Slow but most portable.
scip-from-source = ["russcip/from-source"]

[profile.release]
lto = "thin"
codegen-units = 1
