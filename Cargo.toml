[package]
name = "pb26-hybrid"
version = "0.1.0"
edition = "2021"
description = "Hybrid PRINTEMPS + Exact driver for the Pseudo Boolean Competition 2026"
license = "MIT"

[[bin]]
name = "pb26-hybrid"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
