[package]
name = "pb-hybrid"
version = "0.1.0"
edition = "2021"
description = "Hybrid Exact + PRINTEMPS driver for Pseudo Boolean Competitions"
license = "MIT"

[[bin]]
name = "exact-printemps"
path = "src/main.rs"

[dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
