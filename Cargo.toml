[package]
name = "pb-hybrid"
version = "0.1.0"
edition = "2021"
description = "Hybrid Exact/SCIP + PRINTEMPS driver for Pseudo Boolean Competitions"
license = "MIT"

[lib]
name = "pb_hybrid"
path = "src/lib.rs"

[[bin]]
name = "exact-printemps"
path = "src/bin/exact_printemps.rs"

[[bin]]
name = "scip-printemps"
path = "src/bin/scip_printemps.rs"
required-features = ["scip"]

[dependencies]
nix = { version = "0.29", features = ["signal", "process"] }
signal-hook = "0.3"
russcip = { version = "0.9", default-features = false, optional = true }

[features]
default = []
# Enables the scip-printemps binary and the `pb_hybrid::scip` module. A SCIP
# installation must be reachable somehow: via SCIPOPTDIR, a system install,
# or by combining this feature with `scip-bundled` / `scip-from-source`.
scip = ["dep:russcip"]
# Pull a prebuilt SCIP shared library at build time (network access required).
scip-bundled = ["scip", "russcip/bundled"]
# Build SCIP from source. Produces a static libscip.a so the resulting
# scip-printemps binary only retains dynamic links to common system libs
# (glibc, libstdc++, etc.). Recommended for distributable artifacts.
scip-from-source = ["scip", "russcip/from-source"]

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
